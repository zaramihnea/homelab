controllers:
  scrypted:
    containers:
      app:
        image:
          repository: ghcr.io/koush/scrypted
          tag: v0.147.0-noble-full
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 30m
            memory: 1Gi
          limits:
            memory: 3Gi
        # needed to open /dev/dri for GPU video decoding; a hostPath mount alone gets "Operation not permitted"
        securityContext:
          privileged: true

defaultPodOptions:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  annotations:
    container.apparmor.security.beta.kubernetes.io/app: unconfined

service:
  app:
    controller: scrypted
    ports:
      http:
        port: 11080

persistence:
  volume:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: scrypted-volume
    globalMounts:
      - path: /server/volume
  dbus:
    enabled: true
    type: hostPath
    hostPath: /var/run/dbus
    globalMounts:
      - path: /var/run/dbus
  avahi:
    enabled: true
    type: hostPath
    hostPath: /var/run/avahi-daemon/socket
    globalMounts:
      - path: /var/run/avahi-daemon/socket
  dri:
    enabled: true
    type: hostPath
    hostPath: /dev/dri
    globalMounts:
      - path: /dev/dri
