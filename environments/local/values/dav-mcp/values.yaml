controllers:
  dav-mcp:
    containers:
      app:
        image:
          repository: node
          tag: 22-alpine
          pullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - apk add --no-cache git && npx -y dav-mcp --http --port=3000
        env:
          TZ: Europe/Bucharest
          CALDAV_SERVER_URL:
            valueFrom:
              secretKeyRef:
                name: dav-mcp-secret
                key: CALDAV_SERVER_URL
          CALDAV_USERNAME:
            valueFrom:
              secretKeyRef:
                name: dav-mcp-secret
                key: CALDAV_USERNAME
          CALDAV_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: dav-mcp-secret
                key: CALDAV_PASSWORD
          BEARER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: dav-mcp-secret
                key: BEARER_TOKEN
        resources:
          requests:
            cpu: 5m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi

service:
  app:
    controller: dav-mcp
    ports:
      http:
        port: 3000
