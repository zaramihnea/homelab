controllers:
  icloud-mcp:
    containers:
      app:
        image:
          repository: node
          tag: 22-alpine
          pullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            set -e
            apk add --no-cache git
            git clone https://github.com/adamzaidi/icloud-mcp.git /opt/icloud-mcp
            cd /opt/icloud-mcp
            git checkout d0d3fcfa781090486e6b4757d0710a73a5716133
            npm ci --omit=dev
            npm install --omit=dev express@4
            node - <<'NODE'
            const fs = require('fs');
            const file = '/opt/icloud-mcp/index.js';
            let text = fs.readFileSync(file, 'utf8');

            const allowedTools = [
              'list_accounts',
              'get_inbox_summary',
              'get_mailbox_summary',
              'list_mailboxes',
              'read_inbox',
              'get_email',
              'get_email_raw',
              'get_emails_by_sender',
              'get_emails_by_date_range',
              'search_emails',
              'get_thread',
              'count_emails',
              'get_top_senders',
              'get_unread_senders',
              'get_storage_report',
              'get_unsubscribe_info',
              'list_attachments',
              'get_attachment',
              'save_draft',
              'list_contacts',
              'search_contacts',
              'get_contact',
              'create_contact',
              'list_calendars',
              'list_events',
              'get_event',
              'create_event',
              'update_event',
              'delete_event',
              'search_events',
              'suggest_event_from_email',
              'log_read',
              'log_write',
              'log_clear',
            ];

            const replace = (from, to) => {
              if (!text.includes(from)) throw new Error(`Patch target not found: ${from.slice(0, 80)}`);
              text = text.replace(from, to);
            };

            replace(
              `import { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { CallToolRequestSchema, ListToolsRequestSchema } from '@modelcontextprotocol/sdk/types.js';`,
              `import express from 'express';\nimport { randomUUID } from 'node:crypto';\nimport { StreamableHTTPServerTransport } from '@modelcontextprotocol/sdk/server/streamableHttp.js';\nimport { CallToolRequestSchema, ListToolsRequestSchema, isInitializeRequest } from '@modelcontextprotocol/sdk/types.js';`
            );

            replace(
              `const DEFAULT_ACCOUNT = Object.keys(ACCOUNTS)[0] || 'icloud';`,
              `const DEFAULT_ACCOUNT = Object.keys(ACCOUNTS)[0] || 'icloud';\nconst ALLOWED_TOOLS = new Set(${JSON.stringify(allowedTools, null, 2)});`
            );

            replace(
              `    ]\n  }));\n\n  server.setRequestHandler(CallToolRequestSchema, async (request) => {`,
              `    ].filter(tool => ALLOWED_TOOLS.has(tool.name))\n  }));\n\n  server.setRequestHandler(CallToolRequestSchema, async (request) => {`
            );

            replace(
              `    const { name, arguments: args } = request.params;\n    try {`,
              `    const { name, arguments: args } = request.params;\n    if (!ALLOWED_TOOLS.has(name)) {\n      return { content: [{ type: 'text', text: \`Error: Tool \${name} is disabled on this OpenClaw deployment.\` }], isError: true };\n    }\n    try {`
            );

            replace(
              `  const transport = new StdioServerTransport();\n  await server.connect(transport);\n  process.stderr.write('iCloud Mail MCP Server running\\n');`,
              `  const app = express();\n  app.use(express.json({ limit: '10mb' }));\n\n  const requireBearer = (req, res, next) => {\n    const token = process.env.BEARER_TOKEN;\n    if (!token) return next();\n    if (req.headers.authorization === \`Bearer \${token}\`) return next();\n    res.status(401).json({ error: 'unauthorized' });\n  };\n\n  const transports = {};\n\n  app.get('/healthz', (_req, res) => res.status(200).send('ok'));\n\n  app.post('/mcp', requireBearer, async (req, res) => {\n    const sessionId = req.headers['mcp-session-id'];\n    try {\n      let transport;\n      if (sessionId && transports[sessionId]) {\n        transport = transports[sessionId];\n      } else if (!sessionId && isInitializeRequest(req.body)) {\n        for (const sid of Object.keys(transports)) {\n          try { await transports[sid].close(); } catch {}\n          delete transports[sid];\n        }\n        transport = new StreamableHTTPServerTransport({\n          sessionIdGenerator: () => randomUUID(),\n          onsessioninitialized: sid => { transports[sid] = transport; },\n        });\n        transport.onclose = () => {\n          const sid = transport.sessionId;\n          if (sid) delete transports[sid];\n        };\n        try { await server.close(); } catch {}\n        await server.connect(transport);\n      } else {\n        res.status(400).json({ jsonrpc: '2.0', error: { code: -32000, message: 'Bad Request: No valid session ID provided' }, id: null });\n        return;\n      }\n      await transport.handleRequest(req, res, req.body);\n    } catch (error) {\n      console.error('MCP request failed:', error);\n      if (!res.headersSent) res.status(500).json({ jsonrpc: '2.0', error: { code: -32603, message: 'Internal server error' }, id: null });\n    }\n  });\n\n  app.get('/mcp', requireBearer, async (req, res) => {\n    const sessionId = req.headers['mcp-session-id'];\n    const transport = sessionId ? transports[sessionId] : null;\n    if (!transport) {\n      res.status(400).send('Invalid or missing session ID');\n      return;\n    }\n    await transport.handleRequest(req, res);\n  });\n\n  app.delete('/mcp', requireBearer, async (req, res) => {\n    const sessionId = req.headers['mcp-session-id'];\n    const transport = sessionId ? transports[sessionId] : null;\n    if (!transport) {\n      res.status(400).send('Invalid or missing session ID');\n      return;\n    }\n    await transport.handleRequest(req, res);\n  });\n\n  const port = Number(process.env.PORT || 3000);\n  app.listen(port, () => process.stderr.write(\`iCloud MCP HTTP server running on port \${port}\\n\`));`
            );

            fs.writeFileSync(file, text);
            NODE
            node /opt/icloud-mcp/index.js
        env:
          TZ: Europe/Bucharest
          IMAP_USER:
            valueFrom:
              secretKeyRef:
                name: icloud-mcp-secret
                key: IMAP_USER
          IMAP_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: icloud-mcp-secret
                key: IMAP_PASSWORD
          BEARER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: icloud-mcp-secret
                key: BEARER_TOKEN
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            cpu: 300m
            memory: 512Mi

service:
  app:
    controller: icloud-mcp
    ports:
      http:
        port: 3000
