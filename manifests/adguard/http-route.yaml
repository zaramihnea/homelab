apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
  namespace: adguard
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: https
  hostnames:
    - adguard.home.zaramihnea.dev
  rules:
    - backendRefs:
        - name: adguard
          port: 8080
