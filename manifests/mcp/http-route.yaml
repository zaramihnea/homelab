apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-mcp
  namespace: mcp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: https
  hostnames:
    - grafana-mcp.home.zaramihnea.dev
  rules:
    - backendRefs:
        - name: grafana-mcp
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: icloud-mcp
  namespace: mcp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: https
  hostnames:
    - icloud-mcp.home.zaramihnea.dev
  rules:
    - backendRefs:
        - name: icloud-mcp
          port: 3000
